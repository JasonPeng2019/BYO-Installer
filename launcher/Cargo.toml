[package]
name = "byo"
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[features]
default = ["development"]
development = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
flate2 = "1.0"
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tar = "0.4.46"
toml_edit = "0.22"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
walkdir = "2.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = 1
