name: Quality gates

on:
  pull_request:
  workflow_call:
    inputs:
      execution_commit:
        type: string
        required: false
      input_sha256:
        type: string
        required: false
  push:
    branches:
      - InstallerV1
      - V1/C-Check-version

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  FR13_EXECUTION_COMMIT: ${{ inputs.execution_commit || github.sha }}
  FR13_INPUT_SHA256: ${{ inputs.input_sha256 }}

jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out installer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Bind the committed execution input index
        shell: bash
        run: |
          if [ -z "$FR13_INPUT_SHA256" ]; then
            digest=$(git show HEAD:bc01-ci/CI-INPUTS.json | sha256sum | cut -d ' ' -f1)
            echo "FR13_INPUT_SHA256=$digest" >> "$GITHUB_ENV"
          fi

      - name: Read locked AgentWorkspace commit
        id: agent-source
        shell: bash
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("release/source-lock.json"))["agent_workspace"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out locked AgentWorkspace for release script tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/CodexClaudeWorkflow
          ref: ${{ steps.agent-source.outputs.commit }}
          path: AgentWorkspace
          token: ${{ secrets.BYO_SOURCE_READ_TOKEN }}

      - name: Read locked Firmware MCP commit
        id: firmware-source
        shell: bash
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("release/source-lock.json"))["firmware_mcp"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out locked Firmware MCP for release test dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/BYO-Firmware-MCP
          ref: ${{ steps.firmware-source.outputs.commit }}
          path: Firmware MCP New

      - name: Bind exact frozen bytes before downstream commands
        shell: bash
        run: python -B bc01-ci/verify_frozen_sources.py --phase before

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.20"
          enable-cache: false

      - name: Install locked release test dependencies
        id: test-deps
        run: uv sync --project "Firmware MCP New" --locked --all-groups

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Rust formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --manifest-path launcher/Cargo.toml --check

      - name: Rust lint
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path launcher/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path launcher/Cargo.toml --locked -- --test-threads=1

      - name: Validate release Python
        if: ${{ !cancelled() && steps.test-deps.outcome == 'success' }}
        run: |
          uv run --no-sync --project "Firmware MCP New" python release/scripts/final_acceptance_checks.py --group release-quality --evidence release/build/final-acceptance/release-quality

      - name: Release script unit tests
        if: ${{ !cancelled() && steps.test-deps.outcome == 'success' }}
        run: |
          uv run --no-sync --project "Firmware MCP New" python release/scripts/final_acceptance_checks.py --group release-tests --evidence release/build/final-acceptance/release-tests

      - name: Bind exact frozen bytes after all independent downstream commands
        if: always()
        shell: bash
        run: python -B bc01-ci/verify_frozen_sources.py --phase after

      - name: Retain all independent installer quality outcomes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-quality-${{ github.sha }}-${{ github.run_attempt }}
          path: release/build/final-acceptance/
          if-no-files-found: warn
          retention-days: 90

  agent-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out installer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Bind the committed execution input index
        shell: bash
        run: |
          if [ -z "$FR13_INPUT_SHA256" ]; then
            digest=$(git show HEAD:bc01-ci/CI-INPUTS.json | sha256sum | cut -d ' ' -f1)
            echo "FR13_INPUT_SHA256=$digest" >> "$GITHUB_ENV"
          fi

      - name: Read locked AgentWorkspace commit
        id: source
        shell: bash
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("release/source-lock.json"))["agent_workspace"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Read locked Firmware MCP commit
        id: firmware-source
        shell: bash
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("release/source-lock.json"))["firmware_mcp"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out locked AgentWorkspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/CodexClaudeWorkflow
          ref: ${{ steps.source.outputs.commit }}
          path: AgentWorkspace
          token: ${{ secrets.BYO_SOURCE_READ_TOKEN }}

      - name: Check out locked Firmware MCP for parser compatibility
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/BYO-Firmware-MCP
          ref: ${{ steps.firmware-source.outputs.commit }}
          path: BYO-Firmware-MCP
          token: ${{ secrets.BYO_SOURCE_READ_TOKEN }}

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Bind exact frozen bytes before downstream commands
        shell: bash
        run: python -B bc01-ci/verify_frozen_sources.py --phase before

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.20"
          enable-cache: false

      - name: Install AgentWorkspace system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install actual locked AgentWorkspace dependencies
        id: workspace-deps
        working-directory: AgentWorkspace
        run: |
          uv sync --locked --dev

      - name: Install actual locked parser test interpreter
        id: firmware-deps
        if: ${{ !cancelled() }}
        run: uv sync --project BYO-Firmware-MCP --locked --all-groups

      - name: Run all independent AgentWorkspace contracts
        if: ${{ !cancelled() && steps.workspace-deps.outcome == 'success' && steps.firmware-deps.outcome == 'success' }}
        run: uv run --no-sync --project BYO-Firmware-MCP python release/scripts/final_acceptance_checks.py --group workspace --evidence release/build/final-acceptance/workspace

      - name: Bind exact frozen bytes after all independent downstream commands
        if: always()
        shell: bash
        run: python -B bc01-ci/verify_frozen_sources.py --phase after

      - name: Retain AgentWorkspace contract outcomes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: workspace-quality-${{ github.sha }}-${{ github.run_attempt }}
          path: release/build/final-acceptance/
          if-no-files-found: warn
          retention-days: 90

  firmware-mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out installer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Bind the committed execution input index
        shell: bash
        run: |
          if [ -z "$FR13_INPUT_SHA256" ]; then
            digest=$(git show HEAD:bc01-ci/CI-INPUTS.json | sha256sum | cut -d ' ' -f1)
            echo "FR13_INPUT_SHA256=$digest" >> "$GITHUB_ENV"
          fi

      - name: Read locked Firmware MCP commit
        id: source
        shell: bash
        run: |
          echo "commit=$(python -c 'import json; print(json.load(open("release/source-lock.json"))["firmware_mcp"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out locked Firmware MCP
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/BYO-Firmware-MCP
          ref: ${{ steps.source.outputs.commit }}
          path: Firmware MCP New
          fetch-depth: 2

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Bind exact frozen bytes before downstream commands
        shell: bash
        run: python -B bc01-ci/verify_frozen_sources.py --phase before

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.20"
          enable-cache: false

      - name: Install locked Firmware MCP contract dependencies
        id: firmware-deps
        working-directory: Firmware MCP New
        run: |
          uv sync --locked --all-groups

      - name: Run independent Firmware MCP contract commands
        if: ${{ !cancelled() && steps.firmware-deps.outcome == 'success' }}
        run: uv run --no-sync --project "Firmware MCP New" python release/scripts/final_acceptance_checks.py --group firmware-contract --evidence release/build/final-acceptance/firmware-contract

      - name: Run Windows SWD isolation contract
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.firmware-deps.outcome == 'success' }}
        working-directory: Firmware MCP New
        run: uv run python -m unittest tests.test_swd_process_isolation

      - name: Bind exact frozen bytes after all independent downstream commands
        if: always()
        shell: bash
        run: python -B bc01-ci/verify_frozen_sources.py --phase after

      - name: Retain Firmware MCP contract outcomes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: firmware-contract-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: release/build/final-acceptance/
          if-no-files-found: warn
          retention-days: 90
