name: Quality gates

on:
  pull_request:
  push:
    branches:
      - InstallerV1
      - integration/portability/installer-20261010

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out installer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read locked AgentWorkspace commit
        id: agent-source
        shell: bash
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("release/source-lock.json"))["agent_workspace"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out locked AgentWorkspace for release script tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/CodexClaudeWorkflow
          ref: ${{ steps.agent-source.outputs.commit }}
          path: AgentWorkspace
          token: ${{ secrets.BYO_SOURCE_READ_TOKEN }}

      - name: Read locked Firmware MCP commit
        id: firmware-source
        shell: bash
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("release/source-lock.json"))["firmware_mcp"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out locked Firmware MCP for release test dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/BYO-Firmware-MCP
          ref: ${{ steps.firmware-source.outputs.commit }}
          path: Firmware MCP New

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false

      - name: Install locked release test dependencies
        id: test-deps
        run: uv sync --project "Firmware MCP New" --locked --all-groups

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Rust formatting
        run: cargo fmt --manifest-path launcher/Cargo.toml --check

      - name: Rust lint
        run: cargo clippy --manifest-path launcher/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path launcher/Cargo.toml --locked -- --test-threads=1

      - name: Validate release Python
        run: |
          python3 -m compileall -q release/scripts hil
          pipx run ruff==0.15.21 check release/scripts hil
          pipx run ruff==0.15.21 format --check release/scripts hil

      - name: Release script unit tests
        if: (success() || failure()) && steps.test-deps.outcome == 'success'
        run: |
          result=0
          for script in test_compile_workspace.py test_verify_build_output.py test_build_release.py test_e2e_harness.py test_analysis_tools.py test_analysis_portability.py test_acquire_analysis_inputs.py test_arm_test_toolchain.py test_installed_analysis_ci.py test_code_analysis_portable_smoke_controls.py; do
            if uv run --project "Firmware MCP New" python "release/scripts/$script"; then
              echo "PASS $script"
            else
              result=1
              echo "FAIL $script"
            fi
          done
          exit "$result"

      - name: Validate shell bootstrap
        run: sh -n install.sh

      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -no-color

  agent-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out installer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read locked AgentWorkspace commit
        id: source
        shell: bash
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("release/source-lock.json"))["agent_workspace"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Read locked Firmware MCP commit
        id: firmware-source
        shell: bash
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("release/source-lock.json"))["firmware_mcp"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out locked AgentWorkspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/CodexClaudeWorkflow
          ref: ${{ steps.source.outputs.commit }}
          path: AgentWorkspace
          token: ${{ secrets.BYO_SOURCE_READ_TOKEN }}

      - name: Check out locked Firmware MCP for parser compatibility
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/BYO-Firmware-MCP
          ref: ${{ steps.firmware-source.outputs.commit }}
          path: BYO-Firmware-MCP
          token: ${{ secrets.BYO_SOURCE_READ_TOKEN }}

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false

      - name: Install AgentWorkspace system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Run AgentWorkspace contract
        working-directory: AgentWorkspace
        run: |
          uv sync --locked --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run basedpyright
          uv run pytest
          uv run python bin/render-all-modes --check-idempotent

  firmware-mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out installer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read locked Firmware MCP commit
        id: source
        shell: bash
        run: |
          echo "commit=$(python -c 'import json; print(json.load(open("release/source-lock.json"))["firmware_mcp"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out locked Firmware MCP
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/BYO-Firmware-MCP
          ref: ${{ steps.source.outputs.commit }}
          path: Firmware MCP New
          fetch-depth: 2

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false

      - name: Run Firmware MCP contract
        working-directory: Firmware MCP New
        run: |
          uv sync --locked --all-groups
          uv run ruff check .
          uv run ruff format --check src/pyocd_debug_mcp/sidecar.py src/pyocd_debug_mcp/capabilities/manual_permission_helper.py tests/test_sidecar_runtime.py tests/test_manual_permission_helper_runtime.py
          uv run pyright src/pyocd_debug_mcp/sidecar.py src/pyocd_debug_mcp/capabilities/manual_permission_helper.py
          uv run python -m unittest tests.test_sidecar_runtime tests.test_manual_permission_helper_runtime

      - name: Run Windows SWD isolation contract
        if: runner.os == 'Windows'
        working-directory: Firmware MCP New
        run: uv run python -m unittest tests.test_swd_process_isolation
