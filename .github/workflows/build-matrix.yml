name: Canonical exact source builds and native validation

on:
  workflow_dispatch:
    inputs:
      build_kind:
        description: Cleanup source checks, native contracts, or complete bundle build
        type: choice
        options: [bundle, contracts, cleanup]
        default: bundle
      execution_commit:
        description: Optional exact canonical commit (defaults to event SHA)
        type: string
        required: false
      input_sha256:
        description: Optional committed input digest (defaults to exact Git blob)
        type: string
        required: false
      final_acceptance:
        description: Compatibility input; bundle dispatch always includes required final checks
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - InstallerV1
      - chore/Proto-0.04

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  PYTHONDONTWRITEBYTECODE: '1'
  PYRIGHT_PYTHON_NODE_VERSION: '22.15.0'
  FR13_EXECUTION_COMMIT: ${{ inputs.execution_commit || github.sha }}
  FR13_INPUT_SHA256: ${{ inputs.input_sha256 }}

jobs:
  build:
    needs: [source-quality, workflow-quality]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_kind != 'cleanup' }}
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-15
            archive: zip
          - target: macos-x86_64
            runner: macos-15-intel
            archive: zip
          - target: windows-x86_64
            runner: windows-2022 # The locked Cppcheck recipe requires Visual Studio 2022.
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      SOURCE_DATE_EPOCH: "0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Check out installer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Bind the committed execution input index
        id: input-binding
        shell: bash
        run: |
          if [ -z "$FR13_INPUT_SHA256" ]; then
            digest=$(git -c "safe.directory=$GITHUB_WORKSPACE" show HEAD:bc01-ci/CI-INPUTS.json | sha256sum | cut -d ' ' -f1)
            echo "FR13_INPUT_SHA256=$digest" >> "$GITHUB_ENV"
          fi

      - name: Read release version
        id: release
        shell: bash
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("launcher/Cargo.toml","rb"))["package"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Read locked external commits
        id: source
        shell: bash
        run: |
          echo "agent=$(python -c 'import json; print(json.load(open("release/source-lock.json"))["agent_workspace"]["commit"])')" >> "$GITHUB_OUTPUT"
          echo "firmware=$(python -c 'import json; print(json.load(open("release/source-lock.json"))["firmware_mcp"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out locked AgentWorkspace
        id: workspace-checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/CodexClaudeWorkflow
          ref: ${{ steps.source.outputs.agent }}
          path: AgentWorkspace
          token: ${{ secrets.BYO_SOURCE_READ_TOKEN }}

      - name: Check out locked Firmware MCP
        id: firmware-checkout
        if: ${{ !cancelled() && steps.input-binding.outcome == 'success' && steps.source.outcome == 'success' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/BYO-Firmware-MCP
          ref: ${{ steps.source.outputs.firmware }}
          path: Firmware MCP New

      - name: Install Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'

      - name: Install uv
        if: ${{ !cancelled() }}
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.20'
          enable-cache: false

      - name: Verify frozen inputs before native work
        id: source-before
        if: ${{ !cancelled() && steps.firmware-checkout.outcome == 'success' && steps.workspace-checkout.outcome == 'success' }}
        shell: bash
        run: python -B bc01-ci/verify_frozen_sources.py --phase before-native

      - name: Install pinned build dependencies
        id: build-deps
        if: ${{ !cancelled() && steps.source-before.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build-runtime/evidence/dependency-setup
          # Retry only this exact network/toolchain acquisition, never tests or jobs.
          for attempt in 1 2 3; do
            set +e
            rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
            download_exit=$?
            set -e
            printf '{"kind":"rustup-download","attempt":%s,"exit_code":%s}\n' "$attempt" "$download_exit" | tee -a build-runtime/evidence/dependency-setup/attempts.jsonl
            if [ "$download_exit" -eq 0 ]; then break; fi
            if [ "$attempt" -eq 3 ]; then exit "$download_exit"; fi
            sleep 5
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Build Python remains pinned; setup-python supplies the test host.
            uv python install 3.12.13
            export UV_PYTHON=3.12.13
            python -c 'import hashlib,json,shutil,subprocess; from pathlib import Path; p=Path(shutil.which("clang-cl") or "missing-clang-cl").resolve(); b=p.read_bytes(); Path("build-runtime/evidence/dependency-setup/contract-cc.json").write_text(json.dumps({"path":str(p),"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest(),"version":subprocess.check_output([str(p),"--version"],text=True),"scope":"Windows contract C dependencies; native release compilation remains separate"},indent=2))'
          fi
          uv sync --project "Firmware MCP New" --locked --all-groups --python "${UV_PYTHON:-$(command -v python)}"

          uv run --no-sync --project "Firmware MCP New" python -c "import pytest, pyocd_debug_mcp; print('pytest ready:', pytest.__version__)"

      - name: Enforce Linux glibc baseline builder
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"

      - name: Run Windows launcher cleanup regressions
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build-deps.outcome == 'success' }}
        shell: bash
        run: uv run --no-sync --project "Firmware MCP New" python release/scripts/final_acceptance_checks.py --group windows-cleanup --evidence release/build/final-acceptance/windows-cleanup

      - name: Retained protection, ownership, recovery and privacy regressions
        id: safety-regressions
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' && steps.workspace-checkout.outcome == 'success' }}
        shell: bash
        env:
          BYO_MCP_TEST_WORKSPACE_ROOT: ${{ github.workspace }}/AgentWorkspace
          BYO_TEST_FAILURES: ${{ github.workspace }}/release/build/final-acceptance/safety-inputs
          BYO_FINAL_CASE_EVIDENCE: ${{ github.workspace }}/release/build/final-acceptance/safety-public-cases
          VI11_RECORD_EVIDENCE: ${{ github.workspace }}/release/build/final-acceptance/safety-full-records
        run: |
          cd "Firmware MCP New"
          uv run --no-sync python -m pytest -o addopts= -m 'not live' -q \
          tests/test_lite_protective_overlaps.py \
          tests/test_lite_application_flash.py \
          tests/test_vi02_operation_resource_ownership.py \
          tests/test_vi02a_async_queue_deadline.py \
          tests/test_final_supported_batch_cancellation.py \
          tests/test_vi03_fresh_recovery_grant.py \
          tests/test_vi03_prebackend_diagnostics.py \
          tests/test_vi03_reserved_diagnostics.py \
          tests/test_vi03_unlock_diagnostics.py \
          tests/test_serial_resolver_identity.py \
          tests/test_vi06_uart_ownership.py \
          tests/test_vi07_uart_provenance.py \
          tests/test_vi08_attachment_cache_refusal.py \
          tests/test_final_attachment_replacement.py \
          tests/test_inventory_snapshot_concurrency.py \
          tests/test_vi09_selector_chain.py \
          tests/test_duplicate_elf_symbols.py \
          tests/test_final_registered_symbol_events.py \
          tests/test_monitor_trail_identity.py \
          tests/test_monitor_counters_trail.py \
          tests/test_monitor_thrash_block.py::BlockDiagnostics \
          tests/test_final_posix_startup.py \
          tests/test_design_flaws_2_b06.py::ConnectSafetyTests \
          tests/test_tiered_acceptance_paths.py \
          tests/test_final_regenerated_map.py \
          tests/test_swd_process_isolation.py \
          tests/test_discovery_hook_process.py \
          tests/test_process_cleanup.py \
          tests/test_process_cleanup_churn.py \
          tests/test_code_analysis_posix_ownership.py \
          tests/test_process_callers.py \
          tests/test_process_release_identity.py \
          --junitxml=../release/build/final-acceptance/safety-regressions.xml

      - name: Run launcher source contracts
        id: launcher-contracts
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' }}
        shell: bash
        run: |
          python -B bc01-ci/build_capture.py --name launcher-contracts -- uv run --no-sync --project "Firmware MCP New" python release/scripts/final_acceptance_checks.py --group launcher --evidence release/build/final-acceptance/launcher

      - name: Actual generated macOS shell startup and preservation
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.build-deps.outcome == 'success' }}
        shell: bash
        run: |
          if ! command -v fish; then brew install fish; fi
          cargo test --manifest-path launcher/Cargo.toml --locked generated_profiles_execute_in_real_shell_startup_and_preserve_user_bytes -- --ignored --nocapture

      - name: Complete firmware source quality
        id: firmware-quality
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' }}
        shell: bash
        run: |
          uv run --no-sync --project "Firmware MCP New" python release/scripts/final_acceptance_checks.py --group firmware-quality --evidence release/build/final-acceptance/firmware-quality

      - name: Prepare pinned analysis archives
        id: analysis-inputs
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' && steps.launcher-contracts.outcome == 'success' && steps.firmware-quality.outcome == 'success' && steps.safety-regressions.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          python -B bc01-ci/build_capture.py --name analysis-inputs -- python release/scripts/acquire_analysis_inputs.py --expected-target "$EXPECTED_TARGET" --output "$RUNNER_TEMP/byo-analysis-inputs"
          echo "BYO_ANALYSIS_INPUT_DIR=$RUNNER_TEMP/byo-analysis-inputs" >> "$GITHUB_ENV"

      - name: Build native launcher, sidecar, SBOM, and archive
        id: posix-bundle
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' && steps.launcher-contracts.outcome == 'success' && steps.firmware-quality.outcome == 'success' && steps.safety-regressions.outcome == 'success' && steps.analysis-inputs.outcome == 'success' && runner.os != 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.build_kind != 'contracts') }}
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python -B bc01-ci/build_capture.py --name posix-bundle -- uv run --project "Firmware MCP New" python release/scripts/build_release.py --version "$VERSION" --analysis-input-dir "$BYO_ANALYSIS_INPUT_DIR"

      - name: Build native Windows launcher, sidecar, SBOM, and archive
        id: windows-bundle
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' && steps.launcher-contracts.outcome == 'success' && steps.firmware-quality.outcome == 'success' && steps.safety-regressions.outcome == 'success' && steps.analysis-inputs.outcome == 'success' && runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.build_kind != 'contracts') }}
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python -B bc01-ci/build_capture.py --name windows-bundle -- uv run --project "Firmware MCP New" python release/scripts/build_release.py --version "$VERSION" --analysis-input-dir "$BYO_ANALYSIS_INPUT_DIR"

      - name: Check target and archive contract
        id: archive-contract
        if: ${{ !cancelled() && (steps.posix-bundle.outcome == 'success' || steps.windows-bundle.outcome == 'success') }}
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_ARCHIVE: ${{ matrix.archive }}
        run: python -B bc01-ci/build_capture.py --name archive-contract -- python release/scripts/verify_build_output.py --dist release/dist --expected-target "$EXPECTED_TARGET" --archive-type "$EXPECTED_ARCHIVE"

      - name: Run installed hardware-free E2E
        id: installed-e2e
        if: ${{ !cancelled() && (steps.posix-bundle.outcome == 'success' || steps.windows-bundle.outcome == 'success') }}
        shell: bash
        run: python -B bc01-ci/build_capture.py --name installed-e2e -- python release/scripts/test_installed_e2e.py --bundle "release/dist/byo-${{ steps.release.outputs.version }}-${{ matrix.target }}"

      - name: Run native installed Cppcheck and clangd core checks
        id: installed-analysis
        if: ${{ !cancelled() && (steps.posix-bundle.outcome == 'success' || steps.windows-bundle.outcome == 'success') }}
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          bundle="release/dist/byo-$VERSION-$EXPECTED_TARGET"
          python -B bc01-ci/build_capture.py --name installed-analysis -- uv run --project "Firmware MCP New" python release/scripts/run_installed_analysis_ci.py \
            --expected-target "$EXPECTED_TARGET" --bundle "$bundle" --archive "$bundle.zip" \
            --workspace-source AgentWorkspace --arm-input-dir "$RUNNER_TEMP/byo-arm-core" \
            --evidence release/build/analysis-evidence/installed-core \
            --rustc "$(rustup which rustc)" --artifact-label "candidate-$GITHUB_SHA"

      - name: Observe actual installed launcher forwarding and native store in hosted VM
        id: hosted-forwarding
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' && (steps.posix-bundle.outcome == 'success' || steps.windows-bundle.outcome == 'success') }}
        shell: bash
        run: |
          python -B bc01-ci/build_capture.py --name hosted-forwarding -- uv run --no-sync --project "Firmware MCP New" python release/scripts/final_hosted_forwarding.py --bundle "release/dist/byo-${{ steps.release.outputs.version }}-${{ matrix.target }}" --evidence release/build/final-acceptance/hosted-forwarding

      - name: Complete public compiled MCP and guard accounting
        id: public-mcp
        if: ${{ !cancelled() && (steps.posix-bundle.outcome == 'success' || steps.windows-bundle.outcome == 'success') }}
        shell: bash
        run: |
          uv run --no-sync --project "Firmware MCP New" python release/scripts/final_public_mcp.py --bundle "release/dist/byo-${{ steps.release.outputs.version }}-${{ matrix.target }}" --firmware-source "Firmware MCP New" --evidence release/build/final-acceptance/public-mcp

      - name: Run retained source features
        id: source-suite
        if: ${{ !cancelled() && (steps.posix-bundle.outcome == 'success' || steps.windows-bundle.outcome == 'success') && steps.workspace-checkout.outcome == 'success' }}
        shell: bash
        env:
          BYO_MCP_TEST_CLANGD_EXECUTABLE: ${{ github.workspace }}/release/dist/byo-${{ steps.release.outputs.version }}-${{ matrix.target }}/analysis/clangd/bin/clangd${{ runner.os == 'Windows' && '.exe' || '' }}
          BYO_MCP_TEST_WORKSPACE_ROOT: ${{ github.workspace }}/AgentWorkspace
          BYO_TEST_FAILURES: ${{ github.workspace }}/release/build/final-acceptance/fixture-inputs
        run: |
          uv run --no-sync --project "Firmware MCP New" python -c "import os; from pathlib import Path; assert Path(os.environ['BYO_MCP_TEST_CLANGD_EXECUTABLE']).is_file(), 'native clangd prerequisite missing'"
          uv run --no-sync --project "Firmware MCP New" python -m pytest -c "Firmware MCP New/pytest.ini" "Firmware MCP New/tests" --junitxml=release/build/final-acceptance/firmware-source.xml

      - name: Verify frozen inputs after native work
        if: ${{ always() && steps.firmware-checkout.outcome == 'success' && steps.workspace-checkout.outcome == 'success' }}
        shell: bash
        run: python -B bc01-ci/verify_frozen_sources.py --phase after-native

      - name: Record native stage prerequisites and exact checkout metadata
        if: always()
        shell: bash
        env:
          FINAL_STEP_RESULTS: ${{ toJSON(steps) }}
          FINAL_ACCEPTANCE_REQUESTED: "true"
        run: python release/scripts/final_acceptance_checks.py --record-steps --evidence release/build/final-acceptance/stages.json

      - name: Upload target artifact
        if: ${{ !cancelled() && (steps.posix-bundle.outcome == 'success' || steps.windows-bundle.outcome == 'success') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: byo-${{ matrix.target }}
          path: |
            install.sh
            install.ps1
            release/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Retain authoritative build command streams and source gates
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: build-commands-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-runtime/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Retain native analysis build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: byo-analysis-evidence-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/build/analysis-evidence/
            release/build/final-acceptance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      # Retain the stripped dSYM/PDB/.debug separately from the shipped bundle,
      # keyed by build (per-target, per-commit run) and kept longer, so a crash
      # from a shipped build can still be symbolicated. GitHub artifacts cap at
      # 90 days; a durable/indefinite symbol store is the remaining owner step.
      - name: Upload private symbols (crash symbolication)
        if: ${{ !cancelled() && (steps.posix-bundle.outcome == 'success' || steps.windows-bundle.outcome == 'success') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: byo-symbols-${{ matrix.target }}
          path: release/symbols/
          if-no-files-found: error
          retention-days: 90

  linux-x86_64:
    needs: [source-quality, workflow-quality]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_kind != 'cleanup' }}
    name: linux-x86_64-glibc-2.28
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:fdb9a9c223b215604dc7b6f7e8fff4b39bfea5fbaa7777a2e5544a60dfa437f8
    env:
      SOURCE_DATE_EPOCH: "0"
      CARGO_HOME: /tmp/byo-cargo
      RUSTUP_HOME: /tmp/byo-rustup
      UV_CACHE_DIR: /tmp/byo-uv-cache
      BYO_BUILD_PYTHON: /opt/python/cp312-cp312/bin/python

    steps:
      - name: Check out installer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Bind the committed execution input index
        id: input-binding
        shell: bash
        run: |
          if [ -z "$FR13_INPUT_SHA256" ]; then
            digest=$(git -c "safe.directory=$GITHUB_WORKSPACE" show HEAD:bc01-ci/CI-INPUTS.json | sha256sum | cut -d ' ' -f1)
            echo "FR13_INPUT_SHA256=$digest" >> "$GITHUB_ENV"
          fi

      - name: Read release version
        id: release
        shell: bash
        run: echo "version=$("$BYO_BUILD_PYTHON" -c 'import tomllib; print(tomllib.load(open("launcher/Cargo.toml","rb"))["package"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Read locked external commits
        id: source
        shell: bash
        run: |
          echo "agent=$("$BYO_BUILD_PYTHON" -c 'import json; print(json.load(open("release/source-lock.json"))["agent_workspace"]["commit"])')" >> "$GITHUB_OUTPUT"
          echo "firmware=$("$BYO_BUILD_PYTHON" -c 'import json; print(json.load(open("release/source-lock.json"))["firmware_mcp"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out locked AgentWorkspace
        id: workspace-checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/CodexClaudeWorkflow
          ref: ${{ steps.source.outputs.agent }}
          path: AgentWorkspace
          token: ${{ secrets.BYO_SOURCE_READ_TOKEN }}

      - name: Check out locked Firmware MCP
        id: firmware-checkout
        if: ${{ !cancelled() && steps.input-binding.outcome == 'success' && steps.source.outcome == 'success' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/BYO-Firmware-MCP
          ref: ${{ steps.source.outputs.firmware }}
          path: Firmware MCP New
          token: ${{ secrets.BYO_SOURCE_READ_TOKEN }}

      - name: Verify frozen inputs before native work
        id: source-before
        if: ${{ !cancelled() && steps.firmware-checkout.outcome == 'success' && steps.workspace-checkout.outcome == 'success' }}
        shell: bash
        run: |
          "$BYO_BUILD_PYTHON" -B bc01-ci/verify_frozen_sources.py --phase before-native

      - name: Install pinned Linux build toolchains
        id: build-deps
        if: ${{ !cancelled() && steps.source-before.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/AgentWorkspace"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/Firmware MCP New"
          tar --extract \
            --file /opt/_internal/static-libs-for-embedding-only.tar.xz \
            --directory /opt/_internal
          curl --fail --location --silent --show-error \
            --output /tmp/rustup-init \
            https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init
          echo "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10  /tmp/rustup-init" \
            | sha256sum --check -
          chmod 0755 /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.97.1
          "$BYO_BUILD_PYTHON" -m pip install --disable-pip-version-check uv==0.11.20
          export PATH="$CARGO_HOME/bin:/opt/python/cp312-cp312/bin:$PATH"
          uv sync --project "Firmware MCP New" --locked --all-groups --python "$BYO_BUILD_PYTHON"

          uv run --no-sync --project "Firmware MCP New" --python "$BYO_BUILD_PYTHON" python -c "import pytest, pyocd_debug_mcp; print('pytest ready:', pytest.__version__)"

      - name: Retained Linux protection, ownership, recovery and privacy regressions
        id: safety-regressions
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' && steps.workspace-checkout.outcome == 'success' }}
        shell: bash
        env:
          BYO_MCP_TEST_WORKSPACE_ROOT: ${{ github.workspace }}/AgentWorkspace
          BYO_TEST_FAILURES: ${{ github.workspace }}/release/build/final-acceptance/safety-inputs
          BYO_FINAL_CASE_EVIDENCE: ${{ github.workspace }}/release/build/final-acceptance/safety-public-cases
          VI11_RECORD_EVIDENCE: ${{ github.workspace }}/release/build/final-acceptance/safety-full-records
        run: |
          export PATH="$CARGO_HOME/bin:/opt/python/cp312-cp312/bin:$PATH"
          cd "Firmware MCP New"
          uv run --no-sync --python "$BYO_BUILD_PYTHON" python -m pytest -o addopts= -m 'not live' -q \
          tests/test_lite_protective_overlaps.py \
          tests/test_lite_application_flash.py \
          tests/test_vi02_operation_resource_ownership.py \
          tests/test_vi02a_async_queue_deadline.py \
          tests/test_final_supported_batch_cancellation.py \
          tests/test_vi03_fresh_recovery_grant.py \
          tests/test_vi03_prebackend_diagnostics.py \
          tests/test_vi03_reserved_diagnostics.py \
          tests/test_vi03_unlock_diagnostics.py \
          tests/test_serial_resolver_identity.py \
          tests/test_vi06_uart_ownership.py \
          tests/test_vi07_uart_provenance.py \
          tests/test_vi08_attachment_cache_refusal.py \
          tests/test_final_attachment_replacement.py \
          tests/test_inventory_snapshot_concurrency.py \
          tests/test_vi09_selector_chain.py \
          tests/test_duplicate_elf_symbols.py \
          tests/test_final_registered_symbol_events.py \
          tests/test_monitor_trail_identity.py \
          tests/test_monitor_counters_trail.py \
          tests/test_monitor_thrash_block.py::BlockDiagnostics \
          tests/test_final_posix_startup.py \
          tests/test_design_flaws_2_b06.py::ConnectSafetyTests \
          tests/test_tiered_acceptance_paths.py \
          tests/test_final_regenerated_map.py \
          tests/test_swd_process_isolation.py \
          tests/test_discovery_hook_process.py \
          tests/test_process_cleanup.py \
          tests/test_process_cleanup_churn.py \
          tests/test_code_analysis_posix_ownership.py \
          tests/test_process_callers.py \
          tests/test_process_release_identity.py \
          --junitxml=../release/build/final-acceptance/safety-regressions.xml

      - name: Run native Linux launcher source contracts
        id: launcher-contracts
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' }}
        shell: bash
        run: |
          export PATH="$CARGO_HOME/bin:/opt/python/cp312-cp312/bin:$PATH"
          rustup component add --toolchain 1.97.1 rustfmt clippy
          "$BYO_BUILD_PYTHON" -B bc01-ci/build_capture.py --name launcher-contracts -- uv run --no-sync --project "Firmware MCP New" --python "$BYO_BUILD_PYTHON" python release/scripts/final_acceptance_checks.py --group launcher --evidence release/build/final-acceptance/launcher

      - name: Complete Linux firmware source quality
        id: firmware-quality
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' }}
        shell: bash
        run: |
          export PATH="$CARGO_HOME/bin:/opt/python/cp312-cp312/bin:$PATH"
          uv run --no-sync --project "Firmware MCP New" --python "$BYO_BUILD_PYTHON" python release/scripts/final_acceptance_checks.py --group firmware-quality --evidence release/build/final-acceptance/firmware-quality

      - name: Prepare pinned Linux analyzer and GCC runtime inputs
        id: analysis-inputs
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' && steps.launcher-contracts.outcome == 'success' && steps.firmware-quality.outcome == 'success' && steps.safety-regressions.outcome == 'success' }}
        shell: bash
        run: |
          export PATH="$CARGO_HOME/bin:/opt/python/cp312-cp312/bin:$PATH"
          input_dir="$RUNNER_TEMP/byo-analysis-inputs"
          "$BYO_BUILD_PYTHON" -B bc01-ci/build_capture.py --name analysis-inputs -- "$BYO_BUILD_PYTHON" release/scripts/acquire_analysis_inputs.py --expected-target linux-x86_64 --output "$input_dir"
          compiler=$(readlink -f "$(command -v g++)")
          package=$(rpm -qf --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}' "$compiler")
          source_rpm=$(rpm -qf --qf '%{SOURCERPM}' "$compiler")
          gcc_package=$(rpm -qf --qf '%{NAME}' "$("$compiler" -print-file-name=libgcc.a)")
          notice=$(rpm -ql "$gcc_package" | grep '/COPYING3$')
          # The manylinux image omits RPM documentation. Restore notices from
          # the exact installed GCC package before measuring supplied inputs.
          if [ ! -f "$notice" ] || [ ! -f "$(dirname "$notice")/COPYING.RUNTIME" ]; then
            gcc_nevra=$(rpm -q --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}' "$gcc_package")
            dnf --setopt=tsflags= --setopt=install_weak_deps=False reinstall --assumeyes "$gcc_nevra"
          fi
          test -s "$notice"
          test -s "$(dirname "$notice")/COPYING.RUNTIME"
          "$BYO_BUILD_PYTHON" -B bc01-ci/build_capture.py --name analysis-inputs-gcc -- "$BYO_BUILD_PYTHON" release/scripts/prepare_gcc_runtime_inputs.py \
            --compiler "$compiler" --notices "$(dirname "$notice")" \
            --package "$package" --source "AlmaLinux 8 source RPM: $source_rpm" \
            --output "$input_dir/gcc-runtime"
          echo "BYO_ANALYSIS_INPUT_DIR=$input_dir" >> "$GITHUB_ENV"

      - name: Run native Linux analysis Python source contracts
        id: release-contracts
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' }}
        shell: bash
        run: |
          export PATH="$CARGO_HOME/bin:/opt/python/cp312-cp312/bin:$PATH"
          "$BYO_BUILD_PYTHON" -B bc01-ci/build_capture.py --name release-contracts -- uv run --no-sync --project "Firmware MCP New" --python "$BYO_BUILD_PYTHON" python release/scripts/final_acceptance_checks.py --group release-tests --evidence release/build/final-acceptance/release-tests

      - name: Restore exact installed Linux zlib license notices
        id: zlib-notices
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.build_kind != 'contracts') }}
        shell: bash
        run: |
          set -euo pipefail
          # The manylinux image omits RPM documentation. Restore the installed
          # package's notices before the builder binds their RPM file digests.
          zlib_nevra=$(rpm -q --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}' zlib.x86_64)
          test -n "$zlib_nevra"
          dnf --setopt=tsflags= --setopt=install_weak_deps=False reinstall --assumeyes "$zlib_nevra"

      - name: Build native launcher, sidecar, SBOM, and archive
        id: linux-bundle
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' && steps.launcher-contracts.outcome == 'success' && steps.firmware-quality.outcome == 'success' && steps.safety-regressions.outcome == 'success' && steps.analysis-inputs.outcome == 'success' && steps.zlib-notices.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.build_kind != 'contracts') }}
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          export PATH="$CARGO_HOME/bin:/opt/python/cp312-cp312/bin:$PATH"
          "$BYO_BUILD_PYTHON" -B bc01-ci/build_capture.py --name linux-bundle -- uv run --project "Firmware MCP New" --python "$BYO_BUILD_PYTHON" python release/scripts/build_release.py --version "$VERSION" --analysis-input-dir "$BYO_ANALYSIS_INPUT_DIR"

      - name: Check target and archive contract
        id: archive-contract
        if: ${{ !cancelled() && steps.linux-bundle.outcome == 'success' }}
        shell: bash
        run: |
          "$BYO_BUILD_PYTHON" -B bc01-ci/build_capture.py --name archive-contract -- "$BYO_BUILD_PYTHON" release/scripts/verify_build_output.py \
            --dist release/dist \
            --expected-target linux-x86_64-glibc-2.28 \
            --archive-type tar.gz

      - name: Run installed hardware-free E2E
        id: installed-e2e
        if: ${{ !cancelled() && steps.linux-bundle.outcome == 'success' }}
        shell: bash
        run: |
          "$BYO_BUILD_PYTHON" -B bc01-ci/build_capture.py --name installed-e2e -- "$BYO_BUILD_PYTHON" release/scripts/test_installed_e2e.py \
            --bundle "release/dist/byo-${{ steps.release.outputs.version }}-linux-x86_64"

      - name: Run native installed Cppcheck and clangd core checks
        id: installed-analysis
        if: ${{ !cancelled() && steps.linux-bundle.outcome == 'success' }}
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          export PATH="$CARGO_HOME/bin:/opt/python/cp312-cp312/bin:$PATH"
          bundle="release/dist/byo-$VERSION-linux-x86_64"
          "$BYO_BUILD_PYTHON" -B bc01-ci/build_capture.py --name installed-analysis -- uv run --project "Firmware MCP New" --python "$BYO_BUILD_PYTHON" python release/scripts/run_installed_analysis_ci.py \
            --expected-target linux-x86_64-glibc-2.28 --bundle "$bundle" --archive "$bundle.tar.gz" \
            --workspace-source AgentWorkspace --arm-input-dir "$RUNNER_TEMP/byo-arm-core" \
            --evidence release/build/analysis-evidence/installed-core \
            --artifact-label "candidate-$GITHUB_SHA"

      - name: Observe actual installed Linux launcher forwarding and native store in hosted VM
        id: hosted-forwarding
        if: ${{ !cancelled() && steps.build-deps.outcome == 'success' && steps.linux-bundle.outcome == 'success' }}
        shell: bash
        run: |
          export PATH="$CARGO_HOME/bin:/opt/python/cp312-cp312/bin:$PATH"
          "$BYO_BUILD_PYTHON" -B bc01-ci/build_capture.py --name hosted-forwarding -- uv run --no-sync --project "Firmware MCP New" --python "$BYO_BUILD_PYTHON" python release/scripts/final_hosted_forwarding.py --bundle "release/dist/byo-${{ steps.release.outputs.version }}-linux-x86_64" --evidence release/build/final-acceptance/hosted-forwarding

      - name: Complete public compiled Linux MCP and guard accounting
        id: public-mcp
        if: ${{ !cancelled() && steps.linux-bundle.outcome == 'success' }}
        shell: bash
        run: |
          export PATH="$CARGO_HOME/bin:/opt/python/cp312-cp312/bin:$PATH"
          uv run --no-sync --project "Firmware MCP New" --python "$BYO_BUILD_PYTHON" python release/scripts/final_public_mcp.py --bundle "release/dist/byo-${{ steps.release.outputs.version }}-linux-x86_64" --firmware-source "Firmware MCP New" --evidence release/build/final-acceptance/public-mcp

      - name: Run retained Linux source features
        id: source-suite
        if: ${{ !cancelled() && steps.linux-bundle.outcome == 'success' && steps.workspace-checkout.outcome == 'success' }}
        shell: bash
        env:
          BYO_MCP_TEST_CLANGD_EXECUTABLE: ${{ github.workspace }}/release/dist/byo-${{ steps.release.outputs.version }}-linux-x86_64/analysis/clangd/bin/clangd${{ runner.os == 'Windows' && '.exe' || '' }}
          BYO_MCP_TEST_WORKSPACE_ROOT: ${{ github.workspace }}/AgentWorkspace
          BYO_TEST_FAILURES: ${{ github.workspace }}/release/build/final-acceptance/fixture-inputs
        run: |
          uv run --no-sync --project "Firmware MCP New" --python "$BYO_BUILD_PYTHON" python -c "import os; from pathlib import Path; assert Path(os.environ['BYO_MCP_TEST_CLANGD_EXECUTABLE']).is_file(), 'native clangd prerequisite missing'"
          uv run --no-sync --project "Firmware MCP New" --python "$BYO_BUILD_PYTHON" python -m pytest -c "Firmware MCP New/pytest.ini" "Firmware MCP New/tests" --junitxml=release/build/final-acceptance/firmware-source.xml

      - name: Verify frozen inputs after native work
        if: ${{ always() && steps.firmware-checkout.outcome == 'success' && steps.workspace-checkout.outcome == 'success' }}
        shell: bash
        run: |
          "$BYO_BUILD_PYTHON" -B bc01-ci/verify_frozen_sources.py --phase after-native

      - name: Record Linux stage prerequisites and exact checkout metadata
        if: always()
        shell: bash
        env:
          FINAL_STEP_RESULTS: ${{ toJSON(steps) }}
          FINAL_ACCEPTANCE_REQUESTED: "true"
        run: '"$BYO_BUILD_PYTHON" release/scripts/final_acceptance_checks.py --record-steps --evidence release/build/final-acceptance/stages.json'

      - name: Upload target artifact
        if: ${{ !cancelled() && steps.linux-bundle.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: byo-linux-x86_64-glibc-2.28
          path: |
            install.sh
            install.ps1
            release/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Retain authoritative build command streams and source gates
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: build-commands-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-runtime/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Retain native analysis build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: byo-analysis-evidence-linux-x86_64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/build/analysis-evidence/
            release/build/final-acceptance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      # See the note in the build job: retain stripped symbols separately, keyed
      # by build, kept longer for crash symbolication.
      - name: Upload private symbols (crash symbolication)
        if: ${{ !cancelled() && steps.linux-bundle.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: byo-symbols-linux-x86_64-glibc-2.28
          path: release/symbols/
          if-no-files-found: error
          retention-days: 90

  retained-installed:
    name: Retained Windows installed profile and update contracts
    needs: [build]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.build_kind == 'bundle' && needs.build.result == 'success' }}
    runs-on: windows-2022
    # One additional genuine compiled profile plus two original native driver
    # invocations; their existing request/cleanup budgets remain unchanged.
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Bind canonical inputs and source pins
        id: source
        run: |
          if [ -z "$FR13_INPUT_SHA256" ]; then
            digest=$(git show HEAD:bc01-ci/CI-INPUTS.json | sha256sum | cut -d ' ' -f1)
            echo "FR13_INPUT_SHA256=$digest" >> "$GITHUB_ENV"
          fi
          python -c 'import json,os; d=json.load(open("release/source-lock.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); f.write("firmware="+d["firmware_mcp"]["commit"]+"\nagent="+d["agent_workspace"]["commit"]+"\n")'
      - name: Check out canonical Firmware source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: JasonPeng2019/BYO-Firmware-MCP
          ref: ${{ steps.source.outputs.firmware }}
          path: Firmware MCP New
          persist-credentials: false
      - name: Check out locked workspace source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: JasonPeng2019/CodexClaudeWorkflow
          ref: ${{ steps.source.outputs.agent }}
          path: AgentWorkspace
          token: ${{ secrets.BYO_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify canonical source before derived fixture work
        run: python -B bc01-ci/verify_frozen_sources.py --phase before-retained
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.11.20'
          enable-cache: false
      - name: Install pinned build and driver dependencies
        id: dependencies
        if: ${{ !cancelled() }}
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          uv python install 3.12.13
          uv sync --project "Firmware MCP New" --locked --all-groups --python 3.12.13
      - name: Download exact personal artifact from this run
        id: personal
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: byo-windows-x86_64
          path: release/build/retained-base-payload
      - name: Download independent personal build receipts from this run
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: byo-analysis-evidence-windows-x86_64-${{ github.sha }}-${{ github.run_attempt }}
          path: release/build/retained-base-analysis
      - name: Acquire pinned analyzer inputs for genuine professional build
        id: analysis
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python release/scripts/acquire_analysis_inputs.py --expected-target windows-x86_64 --output "$RUNNER_TEMP/retained-analysis-inputs"
      - name: Acquire genuine native ARM test compiler
        id: arm
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          mkdir -p release/build
          uv run --no-sync --project "Firmware MCP New" python release/scripts/acquire_arm_test_toolchain.py --expected-target windows-x86_64 --output "$RUNNER_TEMP/retained-arm-inputs" > release/build/retained-arm.json
      - name: Build disclosed detached version and professional fixture
        id: profile
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.analysis.outcome == 'success' }}
        run: uv run --no-sync --project "Firmware MCP New" python release/scripts/build_installed_profile_fixture.py --analysis-input-dir "$RUNNER_TEMP/retained-analysis-inputs" --evidence release/build/retained-profile-fixture
      - name: Execute original retained installed and compiled contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.arm.outcome == 'success' }}
        run: |
          uv run --no-sync --project "Firmware MCP New" python release/scripts/run_retained_profiles_ci.py \
            --base-payload release/build/retained-base-payload --base-analysis release/build/retained-base-analysis \
            --profile-fixture release/build/retained-profile-fixture --arm-receipt release/build/retained-arm.json \
            --rustc "$(rustup which rustc)" --evidence release/build/retained-profiles
      - name: Verify canonical source after all independent fixture work
        if: always()
        run: python -B bc01-ci/verify_frozen_sources.py --phase after-retained
      - name: Preserve complete profile build and native contract packet
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: retained-installed-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/build/retained-profile-fixture/PROFILE-FIXTURE.json
            release/build/retained-profile-fixture/*-source.bundle
            release/build/retained-profile-fixture/*.stdout
            release/build/retained-profile-fixture/*.stderr
            release/build/retained-profile-fixture/installer/release/dist/
            release/build/retained-profile-fixture/installer/release/build/analysis-evidence/
            release/build/retained-profiles/
            release/build/retained-arm.json
            release/build/final-acceptance/exact-source-*-retained.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  source-quality:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_kind != 'cleanup' }}
    uses: ./.github/workflows/quality.yml
    with:
      execution_commit: ${{ inputs.execution_commit || github.sha }}
      input_sha256: ${{ inputs.input_sha256 }}
    secrets: inherit

  fixture-cleanup:
    name: Fixture cleanup (${{ matrix.target }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_kind == 'cleanup' }}
    needs: [workflow-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: windows-x86_64
            runner: windows-2022
          - target: macos-aarch64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Bind cleanup inputs
        id: source
        run: |
          digest=$(git show HEAD:bc01-ci/CI-INPUTS.json | sha256sum | cut -d ' ' -f1)
          if [ -z "$FR13_INPUT_SHA256" ]; then
            echo "FR13_INPUT_SHA256=$digest" >> "$GITHUB_ENV"
          fi
          echo "firmware=$(python -c 'import json; print(json.load(open("release/source-lock.json"))["firmware_mcp"]["commit"])')" >> "$GITHUB_OUTPUT"
      - name: Check out locked Firmware source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: JasonPeng2019/BYO-Firmware-MCP
          ref: ${{ steps.source.outputs.firmware }}
          path: Firmware MCP New
          persist-credentials: false
      - name: Verify exact cleanup inputs
        run: python -B bc01-ci/verify_frozen_sources.py --phase before-cleanup
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.11.20'
          enable-cache: false
      - name: Install locked source-test dependencies
        id: dependencies
        run: |
          uv sync --project "Firmware MCP New" --locked --group dev
          uv run --no-sync --project "Firmware MCP New" python -c "import pytest, pyocd_debug_mcp; print('pytest ready:', pytest.__version__)"
      - name: Check changed Firmware fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          cd "Firmware MCP New"
          files=(tests/test_model_pin.py tests/test_process_callers.py tests/test_process_release_identity.py tests/process_caller_fixture.py tests/process_release_fixture.py tests/test_code_analysis_posix_ownership.py tests/conftest.py)
          uv run --no-sync python -m ruff check "${files[@]}"
          uv run --no-sync python -m ruff format --check "${files[@]}"
      - name: Check changed Installer test helpers
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          files=(bc01-ci/build_capture.py release/scripts/final_acceptance_checks.py release/scripts/final_public_mcp.py)
          uv run --no-sync --project "Firmware MCP New" python -m ruff check "${files[@]}"
          uv run --no-sync --project "Firmware MCP New" python -m ruff format --check "${files[@]}"
      - name: Run affected source fixtures through standard pytest and small capture
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          BYO_TEST_FAILURES: ${{ github.workspace }}/release/build/fixture-cleanup/failed-inputs
        run: |
          mkdir -p release/build/fixture-cleanup
          uv run --no-sync --project "Firmware MCP New" python -B bc01-ci/build_capture.py --name fixture-process --cwd "Firmware MCP New" -- \
            uv run --no-sync python -m pytest -o addopts= -m 'not live' -q \
            tests/test_model_pin.py tests/test_swd_process_isolation.py \
            tests/test_discovery_hook_process.py tests/test_process_cleanup.py \
            tests/test_process_cleanup_churn.py tests/test_code_analysis_posix_ownership.py \
            tests/test_process_callers.py tests/test_process_release_identity.py \
            --junitxml="$GITHUB_WORKSPACE/release/build/fixture-cleanup/process.xml"
      - name: Verify unchanged cleanup inputs after execution
        if: always()
        run: python -B bc01-ci/verify_frozen_sources.py --phase after-cleanup
      - name: Preserve cleanup reports and failure inputs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fixture-cleanup-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-runtime/evidence/fixture-process/
            release/build/fixture-cleanup/
            release/build/final-acceptance/exact-source-*-cleanup.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  workflow-quality:
    name: Build workflow quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check build and preparation workflows
        shell: bash
        run: |
          mkdir -p workflow-evidence
          set +e
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -config-file .github/actionlint.yaml > workflow-evidence/actionlint.stdout.log 2> workflow-evidence/actionlint.stderr.log
          code=$?
          echo "$code" > workflow-evidence/actionlint.exit.txt
          cat workflow-evidence/actionlint.stdout.log workflow-evidence/actionlint.stderr.log
          exit "$code"
      - name: Retain workflow quality
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: workflow-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: workflow-evidence/
          if-no-files-found: error
          retention-days: 90
