# DRAFT: staged only on an isolated preparation ref after FR06 closes.
# Temporary replacement for registered .github/workflows/build-matrix.yml.
# Never integrate this overlay into the accepted product candidate.
name: Source formatting preparation - not acceptance
run-name: Exact-source formatter authoring - ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      firmware_commit:
        description: Exact exported firmware source commit after accepted FR06
        required: true
        type: string
      installer_source_commit:
        description: Exact installer source export parent of temporary preparation overlay
        required: true
        type: string
      common_base:
        description: Exact accepted common integration commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  author-formatting-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out temporary preparation ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check out exact firmware source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JasonPeng2019/BYO-Firmware-MCP
          ref: ${{ inputs.firmware_commit }}
          path: Firmware MCP New
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install actual locked formatting dependencies
        run: uv sync --project "Firmware MCP New" --locked --all-groups
      - name: Install exact existing Rust formatting toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Generate source patch and retain exact accounting
        env:
          BYO_FORMAT_FIRMWARE_COMMIT: ${{ inputs.firmware_commit }}
          BYO_FORMAT_INSTALLER_SOURCE_COMMIT: ${{ inputs.installer_source_commit }}
          BYO_FORMAT_COMMON_BASE: ${{ inputs.common_base }}
        run: python -B .github/scripts/format_preparation.py
      - name: Retain authoring artifact even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: format-authoring-${{ github.sha }}-${{ github.run_attempt }}
          path: format-preparation-evidence/
          if-no-files-found: error
          retention-days: 90
