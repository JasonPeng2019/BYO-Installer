schema = 1

# Runtime workflow data. These records are compressed and integrity-bound in
# workspace.pack; they are never projected verbatim into customer projects.
[[rule]]
pattern = "modes/firmware*.toml"
class = "compile"

[[rule]]
pattern = "modes/software*.toml"
class = "developer-only"

[[rule]]
pattern = "modes/research*.toml"
class = "developer-only"

[[rule]]
pattern = "skills-src/common/**"
class = "embed"

[[rule]]
pattern = "skills-src/firmware/**"
class = "embed"

[[rule]]
pattern = "skills-src/software/**"
class = "developer-only"

[[rule]]
pattern = "skills-src/research/**"
class = "developer-only"

[[rule]]
pattern = "instructions/common.md"
class = "embed"

[[rule]]
pattern = "instructions/firmware.md"
class = "embed"

[[rule]]
pattern = "instructions/software.md"
class = "developer-only"

[[rule]]
pattern = "instructions/research.md"
class = "developer-only"

[[rule]]
pattern = "agents/adversarial-critic.md"
class = "embed"

[[rule]]
pattern = "agents/verifier.md"
class = "embed"

[[rule]]
pattern = "agents/research-claim-critic.md"
class = "developer-only"

# Initial user-owned artifacts. BYO creates these only when absent.
[[rule]]
pattern = "templates/*.template.md"
class = "user-template"

# The source Python/shell runtime is retained for private parity tests. Its
# customer-facing mode, projection, hook, doctor, workflow-resource, update,
# and uninstall responsibilities are implemented by the Rust launcher.
[[rule]]
pattern = "internal/**"
class = "developer-only"

[[rule]]
pattern = "bin/**"
class = "developer-only"

[[rule]]
pattern = "hooks/**"
class = "developer-only"

[[rule]]
pattern = "tests/**"
class = "developer-only"

[[rule]]
pattern = "specs/**"
class = "developer-only"

[[rule]]
pattern = ".github/**"
class = "developer-only"

[[rule]]
pattern = ".vscode/**"
class = "developer-only"

[[rule]]
pattern = ".codex/**"
class = "developer-only"

[[rule]]
pattern = "INSTALL.md"
class = "developer-only"

[[rule]]
pattern = "README.md"
class = "developer-only"

[[rule]]
pattern = "pyproject.toml"
class = "developer-only"

[[rule]]
pattern = "pyrightconfig.json"
class = "developer-only"

[[rule]]
pattern = "uv.lock"
class = "developer-only"

[[rule]]
pattern = ".gitignore"
class = "developer-only"
